[build-system]
requires = [
    "scikit-build-core>=0.10",
    "conan>=2.4,<3",
    "pymimir==0.14.1",
]
build-backend = "build_backend"
backend-path = ["."]

[project]
name = "striplan"
version = "0.1.0"
description = "IW search and RGNN integration with an optional nanobind native backend."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.8.0",
    "pymimir==0.14.1",
    "pymimir-rgnn==0.2.5",
    "pymimir-rl==0.2.6",
    "loguru==0.7.3",
    "wandb",
]
authors = [
    { name = "Michael Aichmüller", email = "m.aichmueller@gmail.com" },
]

[project.scripts]
striplan-train = "striplan.train:main"
striplan-plan = "striplan.plan:main"
striplan-summarize-plans = "striplan.summarize_plans:main"

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
wheel.packages = ["src/striplan"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]

[tool.ruff]
line-length = 80
target-version = "py312"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"
